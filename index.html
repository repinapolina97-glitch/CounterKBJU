<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КБЖУ Калькулятор</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #020617 100%);
    color: #e2e8f0;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 28px;
  }

  .field { margin-bottom: 22px; }

  .field-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    font-size: 14px;
    color: #cbd5e1;
  }

  .field-value {
    font-weight: 700;
    color: #38bdf8;
    font-size: 16px;
  }

  input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: #334155;
    border-radius: 3px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    transition: box-shadow 0.2s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    box-shadow: 0 0 0 8px rgba(56, 189, 248, 0.25);
  }

  input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    cursor: pointer;
    border: none;
  }

  .toggle-group {
    display: flex;
    gap: 8px;
  }

  .toggle-group button {
    flex: 1;
    padding: 10px;
    border: 1px solid rgba(148, 163, 184, 0.2);
    background: rgba(15, 23, 42, 0.5);
    color: #94a3b8;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .toggle-group button:hover {
    border-color: rgba(56, 189, 248, 0.4);
    color: #e2e8f0;
  }

  .toggle-group button.active {
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color: #0f172a;
    font-weight: 700;
    border-color: transparent;
  }

  .calc-btn {
    width: 100%;
    padding: 16px;
    margin-top: 8px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color: #0f172a;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
  }

  .calc-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.6);
  }

  .calc-btn:active { transform: translateY(0); }

  .result {
    margin-top: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s, transform 0.4s;
  }

  .result.show {
    opacity: 1;
    transform: translateY(0);
  }

  .result-item {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }

  .result-item .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
    margin-bottom: 6px;
  }

  .result-item .number {
    font-size: 24px;
    font-weight: 800;
    color: #e2e8f0;
  }

  .result-item .unit {
    font-size: 12px;
    color: #64748b;
    margin-left: 2px;
    font-weight: 400;
  }

  .result-item.kcal .number { color: #fbbf24; }
  .result-item.protein .number { color: #38bdf8; }
  .result-item.fat .number { color: #a78bfa; }
  .result-item.carbs .number { color: #34d399; }
</style>
</head>
<body>

<div class="card">
  <h1>КБЖУ Калькулятор</h1>
  <p class="subtitle">Рассчитайте свою суточную норму калорий и БЖУ</p>

  <div class="field">
    <div class="field-header">
      <span>Вес</span>
      <span><span class="field-value" id="weightVal">70</span> кг</span>
    </div>
    <input type="range" id="weight" min="30" max="200" value="70" step="1">
  </div>

  <div class="field">
    <div class="field-header">
      <span>Рост</span>
      <span><span class="field-value" id="heightVal">175</span> см</span>
    </div>
    <input type="range" id="height" min="120" max="220" value="175" step="1">
  </div>

  <div class="field">
    <div class="field-header">
      <span>Возраст</span>
      <span><span class="field-value" id="ageVal">25</span> лет</span>
    </div>
    <input type="range" id="age" min="10" max="100" value="25" step="1">
  </div>

  <div class="field">
    <div class="field-header"><span>Пол</span></div>
    <div class="toggle-group" id="genderGroup">
      <button data-value="male" class="active">Мужской</button>
      <button data-value="female">Женский</button>
    </div>
  </div>

  <div class="field">
    <div class="field-header"><span>Активность</span></div>
    <div class="toggle-group" id="activityGroup">
      <button data-value="1.2">Сидячий</button>
      <button data-value="1.375" class="active">Лёгкая</button>
      <button data-value="1.55">Средняя</button>
      <button data-value="1.725">Высокая</button>
    </div>
  </div>

  <button class="calc-btn" id="calcBtn">Рассчитать</button>

  <div class="result" id="result">
    <div class="result-item kcal">
      <div class="label">Калории</div>
      <div class="number"><span id="kcal">0</span><span class="unit">ккал</span></div>
    </div>
    <div class="result-item protein">
      <div class="label">Белки</div>
      <div class="number"><span id="protein">0</span><span class="unit">г</span></div>
    </div>
    <div class="result-item fat">
      <div class="label">Жиры</div>
      <div class="number"><span id="fat">0</span><span class="unit">г</span></div>
    </div>
    <div class="result-item carbs">
      <div class="label">Углеводы</div>
      <div class="number"><span id="carbs">0</span><span class="unit">г</span></div>
    </div>
  </div>
</div>

<script>
  // показываем текущее значение ползунков рядом с названием
  var weightInput = document.getElementById('weight');
  var heightInput = document.getElementById('height');
  var ageInput = document.getElementById('age');

  weightInput.addEventListener('input', function () {
    document.getElementById('weightVal').textContent = this.value;
  });
  heightInput.addEventListener('input', function () {
    document.getElementById('heightVal').textContent = this.value;
  });
  ageInput.addEventListener('input', function () {
    document.getElementById('ageVal').textContent = this.value;
  });

  // переключатели (пол и активность)
  var gender = 'male';
  var activity = 1.375;

  function setupToggle(groupId, onSelect) {
    var group = document.getElementById(groupId);
    group.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var buttons = group.querySelectorAll('button');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('active');
      }
      btn.classList.add('active');
      onSelect(btn.dataset.value);
    });
  }

  setupToggle('genderGroup', function (v) { gender = v; });
  setupToggle('activityGroup', function (v) { activity = Number(v); });

  // расчёт
  document.getElementById('calcBtn').addEventListener('click', function () {
    var weight = Number(weightInput.value);
    var height = Number(heightInput.value);
    var age = Number(ageInput.value);

    var bmr;
    if (gender === 'male') {
      bmr = 10 * weight + 6.25 * height - 5 * age + 5;
    } else {
      bmr = 10 * weight + 6.25 * height - 5 * age - 161;
    }

    var tdee = bmr * activity;

    var proteinG = (tdee * 0.30) / 4;
    var fatG = (tdee * 0.25) / 9;
    var carbsG = (tdee * 0.45) / 4;

    document.getElementById('kcal').textContent = Math.round(tdee);
    document.getElementById('protein').textContent = Math.round(proteinG);
    document.getElementById('fat').textContent = Math.round(fatG);
    document.getElementById('carbs').textContent = Math.round(carbsG);

    document.getElementById('result').classList.add('show');
  });
</script>

</body>
</html>
